<style>
  .refresh-button {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      font-size: 14px;
      color: #666;
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  .refresh-button:hover:not(:disabled) {
      background-color: #e9ecef;
      color: #333;
      border-color: #ced4da;
  }

  .refresh-button:active:not(:disabled) {
      background-color: #dee2e6;
  }

  .refresh-button:disabled {
      cursor: wait;
      opacity: 0.75;
  }

  .refresh-icon {
      margin-right: 8px;
      width: 16px;
      height: 16px;
  }

  @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
  }

  .refresh-button.is-checking .refresh-icon {
      animation: spin 0.8s linear infinite;
  }
</style>

<button id="refreshButton" class="refresh-button" type="button">
  <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 2v6h-6"></path>
    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
    <path d="M3 22v-6h6"></path>
    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
  </svg>
  <span class="refresh-label">检查更新</span>
</button>

<script>
  (() => {
    const button = document.getElementById('refreshButton');
    const label = button.querySelector('.refresh-label');

    const reloadFreshPage = () => {
      const url = new URL(window.location.href);
      url.searchParams.set('updated', Date.now().toString());
      window.location.replace(url.toString());
    };

    const waitForInstallation = (worker) => {
      if (!worker || worker.state !== 'installing') {
        return Promise.resolve();
      }

      return new Promise((resolve) => {
        const timeout = setTimeout(resolve, 5000);

        const handleStateChange = () => {
          if (worker.state !== 'installing') {
            clearTimeout(timeout);
            worker.removeEventListener('statechange', handleStateChange);
            resolve();
          }
        };

        worker.addEventListener('statechange', handleStateChange);
      });
    };

    button.addEventListener('click', async () => {
      if (button.disabled) {
        return;
      }

      button.disabled = true;
      button.classList.add('is-checking');
      label.textContent = '检查中…';

      try {
        if ('serviceWorker' in navigator) {
          const registration = await navigator.serviceWorker.getRegistration();

          if (registration) {
            await registration.update();
            await waitForInstallation(registration.installing);
          }
        }
      } catch (error) {
        console.warn('Service Worker update check failed:', error);
      }

      reloadFreshPage();
    });
  })();
</script>
